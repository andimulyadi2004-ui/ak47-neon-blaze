name: Build add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          pip install --quiet cairosvg pillow

      - name: Build + validate
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ak47-neon-blaze
          path: dist/*.mcaddon

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AK47_NeonBlaze.mcaddon
            dist/AK47_NeonBlaze_BP.mcpack
            dist/AK47_NeonBlaze_RP.mcpack
